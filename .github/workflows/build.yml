name: Build Xiaomiao

on:
  push:
    branches:
      - main
      - ci/*
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build xueersi-xiaomiao
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run host tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Build Xiaomiao firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py xueersi-xiaomiao \
            --name xueersi-xiaomiao \
            --wake-word disabled

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_xueersi-xiaomiao_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
